<!doctype html>
<html lang="id" data-theme="modern-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniPOS - Sistem Kasir Multi-Bisnis</title>
    <!-- Google Fonts for Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        console.error('OmniPOS Global Startup Error:', e.error || e.message);
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.firstElementChild.id !== 'omnipos-app')) {
          var errBox = document.createElement('div');
          errBox.style.cssText = 'position:fixed;inset:0;background:#0f172a;color:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:99999;font-family:system-ui,-apple-system,sans-serif;text-align:center;';
          errBox.innerHTML = '<div style="background:#1e293b;border:1px solid #ef4444;border-radius:16px;max-width:480px;padding:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">' +
            '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="font-size:16px;font-weight:bold;color:#f87171;margin-bottom:8px;">Terjadi Kendala Memuat Aplikasi</h2>' +
            '<p style="font-size:12px;color:#94a3b8;margin-bottom:16px;font-family:monospace;background:#0f172a;padding:8px;border-radius:8px;text-align:left;overflow-x:auto;">' + (e.message || 'Script error') + '</p>' +
            '<div style="display:flex;gap:8px;justify-content:center;">' +
            '<button onclick="window.location.reload()" style="padding:8px 16px;background:#10b981;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;">Muat Ulang (F5)</button>' +
            '<button onclick="window.location.href=\'http://127.0.0.1:5000\'" style="padding:8px 16px;background:#334155;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;">Buka di Browser</button>' +
            '</div></div>';
          document.body.appendChild(errBox);
        }
      });
    </script>
    <script type="module" crossorigin src="/assets/index-DlPDIMuv.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-6Tt3HsKJ.css">
  </head>
  <body class="bg-app text-text-primary antialiased select-none overflow-hidden">
    <div id="root">
      <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:20px;">
        <div style="width:48px;height:48px;border-radius:12px;background:#059669;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;margin-bottom:16px;box-shadow:0 10px 25px -5px rgba(5,150,105,0.4);">🛍️</div>
        <div style="font-size:20px;font-weight:bold;letter-spacing:-0.5px;margin-bottom:6px;">OmniPOS Enterprise</div>
        <div style="font-size:13px;color:#94a3b8;margin-bottom:20px;">Memuat sistem kasir &amp; basis data...</div>
        <div style="width:160px;height:4px;background:#1e293b;border-radius:999px;overflow:hidden;position:relative;">
          <div style="width:50%;height:100%;background:#10b981;border-radius:999px;animation:omnipos-indet 1.5s infinite ease-in-out;"></div>
        </div>
        <noscript>
          <div style="margin-top:20px;color:#f87171;font-size:12px;">JavaScript dinonaktifkan di browser/webview ini. Mohon aktifkan JavaScript.</div>
        </noscript>
        <style>
          @keyframes omnipos-indet {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
  </body>
</html>
